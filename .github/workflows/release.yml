# A tag v* builds barad for every platform from that commit, attests the build's
# provenance (SLSA, signed through Sigstore with this workflow's identity), and
# publishes the binaries, SHA256SUMS and install.sh as the release.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/barad-$os-$arch$ext" ./cmd/barad
          done
          sed "s/__VERSION__/$VERSION/" install.sh > dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "barad $VERSION" \
            --notes "Install: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\`

          Verify a download: \`gh attestation verify barad-linux-amd64 --repo $GITHUB_REPOSITORY\`"
