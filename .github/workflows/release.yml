# A tag v* builds barad for every platform from that commit, signs SHA256SUMS
# with the release key (SHA256SUMS.sig, which `barad update` checks), attests
# the build's provenance (SLSA, signed through Sigstore with this workflow's
# identity), and publishes it all with install.sh as the release.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release # holds RELEASE_SIGNING_KEY; only v* tags may deploy to it
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestation
      attestations: write # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/barad-$os-$arch$ext" ./cmd/barad
          done
          sed "s/__VERSION__/$VERSION/" install.sh > dist/install.sh
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Sign the checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          key=$(mktemp)
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS | base64 -w0 > dist/SHA256SUMS.sig
          rm -f "$key"
          # what barad update checks: the signature against the key barad carries
          sig=$(mktemp)
          base64 -d dist/SHA256SUMS.sig > "$sig"
          openssl pkeyutl -verify -pubin -inkey internal/update/release-signing.pem -rawin -in dist/SHA256SUMS -sigfile "$sig"
          rm -f "$sig"
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "barad $VERSION" \
            --notes "Install: \`curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh\`

          Update: \`barad update\`

          Verify a download: \`gh attestation verify barad-linux-amd64 --repo $GITHUB_REPOSITORY\`"
